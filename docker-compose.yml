services:
  hive:
    image: johpaz/hive:latest
    # build: .   # uncomment to build locally instead of pulling
    ports:
      - "18790:18790"
    volumes:
      - hive-data:/root/.hive
      - ${HOME}:/host/home
    environment:
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 18790

    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:18790/health" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  hive-data:
    driver: local
