services:
  hive:
    image: johpaz/hive-agents:0.0.8
    ports:
      - "18790:18790"
      - "18791:18791"
    volumes:
      - hive-data:/root/.hive
    environment:
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 18790
      # Ollama running on the host machine — host.docker.internal resolves via extra_hosts below
      OLLAMA_HOST: http://host.docker.internal:11434
      HIVE_PUBLIC_URL: ${HIVE_PUBLIC_URL:-}
      NO_BROWSER: "1"
      HIVE_UI_DIR: /app/ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -O- http://127.0.0.1:18790/health 2>/dev/null | grep -q status" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  hive-data:
