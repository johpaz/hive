services:
  hive:
    image: johpaz/hive:7.1.19
    # build: .   # uncomment to build locally instead of pulling
    ports:
      - "18790:18790"
    volumes:
      - hive-data:/root/.hive
    environment:
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 18790

    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:18790/health').then(r => { if (!r.ok) process.exit(1) })" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  hive-data:
