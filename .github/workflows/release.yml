name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ─── Build UI (shared artifact) ───────────────────────────────────────────
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install UI dependencies
        run: cd packages/hive-ui && bun install

      - name: Build UI
        run: cd packages/hive-ui && bun run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
          retention-days: 1

  # ─── Build binaries ────────────────────────────────────────────────────────
  build-binaries:
    name: Build binary (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            runner: ubuntu-latest
            target: bun-linux-x64
          - name: linux-arm64
            runner: ubuntu-latest
            target: bun-linux-arm64
          - name: macos-x64
            runner: ubuntu-latest
            target: bun-darwin-x64
          - name: macos-arm64
            runner: ubuntu-latest
            target: bun-darwin-arm64
          - name: windows-x64
            runner: ubuntu-latest
            target: bun-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Link workspace packages
        run: |
          mkdir -p node_modules/@johpaz
          ln -sf ../../packages/core        node_modules/@johpaz/hive-agents-core
          ln -sf ../../packages/mcp         node_modules/@johpaz/hive-agents-mcp
          ln -sf ../../packages/skills      node_modules/@johpaz/hive-agents-skills
          ln -sf ../../packages/cli         node_modules/@johpaz/hive-cli
          echo "Workspace symlinks created:"
          ls -la node_modules/@johpaz/

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/

      - name: Verify UI dist
        run: |
          echo "=== Verifying UI Dist ==="
          echo "UI dist contents:"
          ls -la packages/hive-ui/dist/
          echo "File count: $(find packages/hive-ui/dist -type f | wc -l)"
          echo "=== UI Dist verification complete ==="

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate UI bundle
        run: |
          echo "=== Generating UI Bundle ==="
          echo "Current directory: $(pwd)"
          echo "Script location:"
          ls -la packages/cli/scripts/generate-ui-bundle.ts
          echo ""
          echo "Running generate-ui-bundle.ts..."
          bun packages/cli/scripts/generate-ui-bundle.ts
          echo ""
          echo "Generated bundle:"
          ls -la packages/cli/src/ui-bundle.generated.ts
          echo "Bundle content preview:"
          head -5 packages/cli/src/ui-bundle.generated.ts
          echo "=== UI Bundle generation complete ==="

      - name: Compile binary
        run: |
          EXT=""
          [[ "${{ matrix.platform.name }}" == "windows-x64" ]] && EXT=".exe"
          bun build --compile \
            --target=${{ matrix.platform.target }} \
            --tsconfig-override=tsconfig.json \
            --outfile=hive-v${{ steps.version.outputs.VERSION }}-${{ matrix.platform.name }}${EXT} \
            ./packages/cli/src/index.ts

      - name: Make executable (Unix)
        if: matrix.platform.name != 'windows-x64'
        run: chmod +x hive-v${{ steps.version.outputs.VERSION }}-${{ matrix.platform.name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.name }}
          path: hive-v${{ steps.version.outputs.VERSION }}-${{ matrix.platform.name }}*
          retention-days: 1

  # ─── GitHub Release ────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ui, build-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package UI dist
        run: |
          cd artifacts/hive-ui-dist
          tar -czf ../../ui-dist.tar.gz .
          cd ../..

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "hive-v*" -type f | while read f; do
            cp "$f" "../$(basename $f)"
          done
          cd ..
          sha256sum hive-v* ui-dist.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hive v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Instalación rápida

            **Docker (recomendado):**
            ```bash
            docker run -d -p 18790:18790 -v ~/.hive:/root/.hive --name hive johpaz/hive-agents:${{ steps.version.outputs.VERSION }}
            ```

            **npm:**
            ```bash
            npm install -g @johpaz/hive-agents@${{ steps.version.outputs.VERSION }}
            ```

            **Binario (Linux x64):**
            ```bash
            curl -L -o hive https://github.com/johpaz/hive/releases/download/${{ github.ref_name }}/hive-v${{ steps.version.outputs.VERSION }}-linux-x64
            chmod +x hive && ./hive start
            ```

            Ver el [README](https://github.com/johpaz/hive#instalaci%C3%B3n) para todas las opciones de instalación.
          files: |
            hive-v*
            ui-dist.tar.gz
            checksums.txt
          generate_release_notes: true

  # ─── Docker Hub ────────────────────────────────────────────────────────────
  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            johpaz/hive-agents:latest
            johpaz/hive-agents:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── npm ──────────────────────────────────────────────────────────────────
  npm:
    name: npm publish
    runs-on: ubuntu-latest
    needs: [build-ui, github-release]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Link workspace packages
        run: |
          mkdir -p node_modules/@johpaz
          ln -sf ../../packages/core        node_modules/@johpaz/hive-agents-core
          ln -sf ../../packages/mcp         node_modules/@johpaz/hive-agents-mcp
          ln -sf ../../packages/skills      node_modules/@johpaz/hive-agents-skills
          ln -sf ../../packages/cli         node_modules/@johpaz/hive-cli

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/

      - name: Build package (includes Windows shims)
        run: |
          bun build packages/cli/src/index.ts --bundle --tsconfig-override=tsconfig.json --outfile dist/hive.js --target bun
          cp -r packages/hive-ui/dist dist/ui
          bun packages/cli/scripts/postbuild.ts

      - name: Verify build artifacts
        run: |
          echo "=== Verifying build artifacts ==="
          echo "dist/ contents:"
          ls -la dist/
          echo ""
          echo "Checking required files:"
          test -f dist/hive.js && echo "✓ dist/hive.js exists" || (echo "✗ dist/hive.js missing" && exit 1)
          test -f dist/hive.cmd && echo "✓ dist/hive.cmd exists (Windows)" || (echo "✗ dist/hive.cmd missing" && exit 1)
          test -f dist/hive.ps1 && echo "✓ dist/hive.ps1 exists (PowerShell)" || (echo "✗ dist/hive.ps1 missing" && exit 1)
          test -d dist/ui && echo "✓ dist/ui/ exists" || (echo "✗ dist/ui/ missing" && exit 1)
          echo "=== All artifacts verified ==="

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
