name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match tag and package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"

  build-ui:
    name: Build UI
    runs-on: ubuntu-24.04
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build UI
        run: bun --cwd=packages/hive-ui run build
      - name: Verify UI entrypoint
        run: test -f packages/hive-ui/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
          retention-days: 1

  build-worker:
    name: Build platform-neutral tool worker
    runs-on: ubuntu-24.04
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build worker
        run: bun build packages/core/src/tool-runtime/tool-worker.ts --target=bun --outfile=tool-worker.js
      - name: Reject native dependencies in worker
        shell: bash
        run: |
          ! grep -Fq '../native.cjs' tool-worker.js
          ! grep -Fq '@johpaz/hive-db' tool-worker.js
          ! grep -Fq 'JsHiveDb' tool-worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: tool-worker
          path: tool-worker.js
          retention-days: 1

  build-binaries:
    name: Build gateway (${{ matrix.platform.name }})
    needs: [validate-version, build-ui]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            runner: ubuntu-24.04
            target: bun-linux-x64
            extension: ""
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            extension: ""
          - name: macos-x64
            runner: macos-15-intel
            target: bun-darwin-x64
            extension: ""
          - name: macos-arm64
            runner: macos-15
            target: bun-darwin-arm64
            extension: ""
          - name: windows-x64
            runner: windows-2025
            target: bun-windows-x64
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies for native platform
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
      - name: Generate embedded UI
        run: bun packages/cli/scripts/generate-ui-bundle.ts
      - name: Compile gateway
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTFILE="hive-v${VERSION}-${{ matrix.platform.name }}${{ matrix.platform.extension }}"
          bun scripts/build-gateway.ts --target "${{ matrix.platform.target }}" --outfile "$OUTFILE"
          if [[ "${{ matrix.platform.name }}" != "windows-x64" ]]; then chmod +x "$OUTFILE"; fi
      - name: Smoke gateway, HiveDB, and embedded UI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTFILE="hive-v${VERSION}-${{ matrix.platform.name }}${{ matrix.platform.extension }}"
          bun scripts/smoke-release.ts --executable "$OUTFILE" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.name }}
          path: hive-v*-${{ matrix.platform.name }}*
          retention-days: 1

  build-npm-package:
    name: Build and smoke npm tarball
    runs-on: ubuntu-24.04
    needs: [validate-version, build-ui, build-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
      - name: Build package once
        run: bun scripts/build-npm-package.ts --prebuilt-ui
      - name: Verify package layout
        run: bun scripts/verify-package.ts
      - name: Pack exact publish artifact
        id: pack
        shell: bash
        run: |
          TARBALL="$(npm pack --ignore-scripts --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          # Capture the full listing before grepping it — piping tar straight into
          # `grep -q` lets grep close the pipe as soon as it matches, and tar (still
          # writing the remaining entries) dies with "stdout: write error" (SIGPIPE)
          # under bash's default -o pipefail, failing the step even on a real match.
          ENTRIES="$(tar -tf "$TARBALL")"
          grep -qF 'package/dist/ui/index.html' <<< "$ENTRIES"
          ! grep -qF 'package/dist/ui/dist/' <<< "$ENTRIES"
      - name: Install and smoke packed artifact
        shell: bash
        run: |
          PREFIX="$RUNNER_TEMP/hive-global"
          npm install --global --prefix "$PREFIX" "./${{ steps.pack.outputs.tarball }}"
          bun scripts/smoke-release.ts \
            --executable "$PREFIX/bin/hive" \
            --version "${GITHUB_REF_NAME#v}" \
            --ui-dir "$PREFIX/lib/node_modules/@johpaz/hive-agents/dist/ui"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 1

  validate-docker:
    name: Validate Docker (${{ matrix.platform.name }})
    needs: [validate-version, build-ui]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-amd64
            runner: ubuntu-24.04
            docker: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            docker: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build image for native architecture
        run: docker build --platform "${{ matrix.platform.docker }}" -t hive-release-smoke .
      - name: Smoke container gateway and UI
        shell: bash
        run: |
          docker run -d --name hive-release-smoke -p 18790:18790 hive-release-smoke
          trap 'docker logs hive-release-smoke; docker rm -f hive-release-smoke' EXIT
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:18790/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18790/health | grep -q '"status":"ok"'
          curl -fsSL http://127.0.0.1:18790/ | grep -q '<div id="root">'

  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    needs: [build-ui, build-worker, build-binaries, build-npm-package, validate-docker]
    steps:
      - run: echo "All release artifacts passed their runtime smoke tests."

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: release-gate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Assemble release files
        shell: bash
        run: |
          tar -czf ui-dist.tar.gz -C artifacts/hive-ui-dist .
          find artifacts -type f -name 'hive-v*' -exec cp {} . \;
          cp artifacts/tool-worker/tool-worker.js .
          sha256sum hive-v* tool-worker.js ui-dist.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Hive ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            hive-v*
            tool-worker.js
            ui-dist.tar.gz
            checksums.txt

  npm-publish:
    name: Publish npm tarball
    runs-on: ubuntu-24.04
    needs: release-gate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm publish ./*.tgz --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-publish:
    name: Publish Docker manifest
    runs-on: ubuntu-24.04
    needs: release-gate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: johpaz/hive-agents
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
