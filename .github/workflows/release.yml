name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a re-lanzar (ej. v1.0.1). Debe existir ya en el repo."
        required: true

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # En push de tag, github.ref_name YA es el tag y github.sha YA es su
      # commit. En un reintento manual (workflow_dispatch) github.ref_name es
      # la rama por defecto del repo y github.sha es el HEAD de esa rama, no
      # el commit del tag — así que se resuelve el SHA real del tag con
      # checkout+rev-parse. Todo job de aquí en adelante usa estos outputs en
      # vez de GITHUB_REF_NAME / github.ref_name / github.sha.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: resolve
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    needs: resolve-tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - name: Match tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${{ needs.resolve-tag.outputs.version }}" = "$PACKAGE_VERSION"
      - name: Match tag and desktop manifests
        shell: bash
        run: |
          TAURI_VERSION="$(node -p "require('./apps/hive-desktop/src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/hive-desktop/src-tauri/Cargo.toml | head -1)"
          test "${{ needs.resolve-tag.outputs.version }}" = "$TAURI_VERSION"
          test "${{ needs.resolve-tag.outputs.version }}" = "$CARGO_VERSION"

  build-ui:
    name: Build UI
    runs-on: ubuntu-24.04
    needs: [resolve-tag, validate-version]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build UI
        run: bun --cwd=packages/hive-ui run build
      - name: Verify UI entrypoint
        run: test -f packages/hive-ui/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
          retention-days: 1

  build-worker:
    name: Build platform-neutral tool worker
    runs-on: ubuntu-24.04
    needs: [resolve-tag, validate-version]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build worker
        run: bun build packages/core/src/tool-runtime/tool-worker.ts --target=bun --outfile=tool-worker.js
      - name: Reject native dependencies in worker
        shell: bash
        run: |
          ! grep -Fq '../native.cjs' tool-worker.js
          ! grep -Fq '@johpaz/hive-db' tool-worker.js
          ! grep -Fq 'JsHiveDb' tool-worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: tool-worker
          path: tool-worker.js
          retention-days: 1

  build-desktop:
    name: Build desktop (${{ matrix.platform.name }})
    needs: [resolve-tag, validate-version, build-ui]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            flatpak: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            flatpak: false
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            flatpak: false
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            flatpak: false
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            flatpak: false
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.platform.target }}
      HIVE_DESKTOP_PREBUILT_UI: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # linuxdeploy empaqueta el AppImage como... un AppImage, que se ejecuta
      # montándose vía FUSE. Los runners ubuntu-24.04 no traen libfuse2 (ver
      # apt-get abajo) ni siempre exponen /dev/fuse de forma confiable — esto
      # lo hace correr por extracción directa en vez de depender del montaje,
      # sin efecto sobre deb/rpm/dmg/msi/nsis.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            libssl-dev \
            libfuse2
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
      - name: Install Rust target
        shell: bash
        run: rustup target add "${{ matrix.platform.target }}"
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build native Hive installer
        shell: bash
        run: cargo tauri build --config tauri.release.conf.json --bundles "${{ matrix.platform.bundles }}"
        working-directory: apps/hive-desktop/src-tauri
      - name: Install Flatpak tooling
        if: matrix.platform.flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Sdk//49 org.gnome.Platform//49
      - name: Build Flatpak
        if: matrix.platform.flatpak
        shell: bash
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build \
            apps/hive-desktop/flatpak/io.hiveagents.desktop.yml
          flatpak build-bundle flatpak-repo \
            "Hive-${VERSION}-linux-x86_64.flatpak" io.hiveagents.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.name }}
          path: |
            apps/hive-desktop/src-tauri/target/release/bundle/
            Hive-*.flatpak
          if-no-files-found: error
          retention-days: 1

  build-npm-package:
    name: Build and smoke npm tarball
    runs-on: ubuntu-24.04
    needs: [resolve-tag, validate-version, build-ui, build-worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
      - name: Build package once
        run: bun scripts/build-npm-package.ts --prebuilt-ui
      - name: Verify package layout
        run: bun scripts/verify-package.ts
      - name: Pack exact publish artifact
        id: pack
        shell: bash
        run: |
          TARBALL="$(npm pack --ignore-scripts --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          # Capture the full listing before grepping it — piping tar straight into
          # `grep -q` lets grep close the pipe as soon as it matches, and tar (still
          # writing the remaining entries) dies with "stdout: write error" (SIGPIPE)
          # under bash's default -o pipefail, failing the step even on a real match.
          ENTRIES="$(tar -tf "$TARBALL")"
          grep -qF 'package/dist/ui/index.html' <<< "$ENTRIES"
          ! grep -qF 'package/dist/ui/dist/' <<< "$ENTRIES"
      - name: Install and smoke packed artifact
        shell: bash
        run: |
          PREFIX="$RUNNER_TEMP/hive-global"
          npm install --global --prefix "$PREFIX" "./${{ steps.pack.outputs.tarball }}"
          bun scripts/smoke-release.ts \
            --executable "$PREFIX/bin/hive" \
            --version "${{ needs.resolve-tag.outputs.version }}" \
            --ui-dir "$PREFIX/lib/node_modules/@johpaz/hive-agents/dist/ui"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 1

  validate-docker:
    name: Validate Docker (${{ matrix.platform.name }})
    needs: [resolve-tag, validate-version, build-ui]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-amd64
            runner: ubuntu-24.04
            docker: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            docker: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - name: Build image for native architecture
        run: docker build --platform "${{ matrix.platform.docker }}" -t hive-release-smoke .
      - name: Smoke container gateway and UI
        shell: bash
        run: |
          docker run -d --name hive-release-smoke -p 18790:18790 hive-release-smoke
          trap 'docker logs hive-release-smoke; docker rm -f hive-release-smoke' EXIT
          # The gateway binds the port and answers /health with 200 {"status":"starting"}
          # before the real router is installed — every other route 503s during that
          # window. `curl -f` only checks the HTTP status, which is 200 in both the
          # placeholder and ready states, so wait for the body to actually say "ok".
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:18790/health 2>/dev/null | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18790/health | grep -q '"status":"ok"'
          curl -fsSL http://127.0.0.1:18790/ | grep -q '<div id="root">'

          # El binario compilado reporta la versión de package.json: si la imagen
          # se armó con un contexto viejo, esto no coincide con el tag.
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          curl -fsS http://127.0.0.1:18790/health | grep -q "\"version\":\"$VERSION\""

          # `<div id="root">` está en cualquier build de la UI, así que no
          # distingue la que la etapa ui-builder acaba de compilar de una copia
          # vieja embebida en el binario (packages/cli/src/ui-bundle.generated.ts).
          # El hash de vite sí: index-<hash>.js cambia en cada build. Si el
          # gateway sirve un hash que no está en /app/ui, está sirviendo el embed.
          docker exec hive-release-smoke cat /app/ui/index.html > disk-index.html
          curl -fsSL http://127.0.0.1:18790/ > served-index.html
          DISK_ASSET="$(grep -o '/assets/index-[^"]*\.js' disk-index.html | head -1)"
          SERVED_ASSET="$(grep -o '/assets/index-[^"]*\.js' served-index.html | head -1)"
          test -n "$DISK_ASSET"
          test "$SERVED_ASSET" = "$DISK_ASSET"
          curl -fsS "http://127.0.0.1:18790$SERVED_ASSET" > /dev/null

  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    needs: [build-ui, build-worker, build-desktop, build-npm-package, validate-docker]
    steps:
      - run: echo "All release artifacts passed their runtime smoke tests."

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [resolve-tag, release-gate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Assemble release files
        shell: bash
        run: |
          # Solo instaladores de escritorio: se descartó publicar los binarios
          # standalone de Bun (npm y Docker ya cubren esas rutas de instalación).
          # Se filtra por extensión en vez de copiar todo `*/bundle/*`, porque ese
          # árbol también contiene el AppDir del AppImage completo (cientos de
          # .so) y colisiones de basename entre plataformas se pisarían en
          # silencio.
          mkdir -p release-assets
          find artifacts -type f \( \
              -iname '*.deb' -o -iname '*.rpm' -o -iname '*.AppImage' -o \
              -iname '*.dmg' -o -iname '*.exe' -o -iname '*.msi' \
            \) -exec cp {} release-assets/ \;
          find artifacts -type f -name '*.flatpak' -exec cp {} release-assets/ \;
          bun scripts/create-updater-manifest.ts \
            --artifacts-dir artifacts \
            --version "${{ needs.resolve-tag.outputs.version }}" \
            --output latest.json
          sha256sum release-assets/* latest.json > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Hive ${{ needs.resolve-tag.outputs.tag }}
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/*
            latest.json
            checksums.txt

  npm-publish:
    name: Publish npm tarball
    runs-on: ubuntu-24.04
    needs: release-gate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm publish ./*.tgz --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-publish:
    name: Publish Docker manifest
    runs-on: ubuntu-24.04
    needs: [resolve-tag, release-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: johpaz/hive-agents
          # type=semver se resuelve a partir de github.ref, que en un reintento
          # manual (workflow_dispatch) es la rama por defecto y no un tag —
          # el tag semver saldría vacío y solo se publicaría `latest`. Se fija
          # el valor explícitamente con el output de resolve-tag en su lugar.
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.resolve-tag.outputs.version }}
          # La label revision por defecto sale de github.sha, que en un
          # workflow_dispatch es el HEAD de la rama, no el commit del tag que
          # realmente se está empaquetando (checkout usa needs.resolve-tag.tag).
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-tag.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-docker-publish:
    name: Verificar la imagen publicada en Docker Hub
    runs-on: ubuntu-24.04
    needs: [resolve-tag, docker-publish]
    steps:
      # validate-docker prueba una imagen construida localmente; esto prueba la
      # que quedó en el registry, que es la que instala un usuario. Cubre el caso
      # de un push a un tag equivocado, un cache de buildx que rehusó una capa
      # que no correspondía, o un `latest` que quedó apuntando a otra versión.
      - name: Bajar el tag publicado
        shell: bash
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          docker pull "johpaz/hive-agents:$VERSION"
          docker pull "johpaz/hive-agents:latest"
      - name: latest y el tag de versión son la misma imagen, construida en este commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-tag.outputs.sha }}
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          test "$(docker image inspect -f '{{.Id}}' "johpaz/hive-agents:$VERSION")" \
             = "$(docker image inspect -f '{{.Id}}' johpaz/hive-agents:latest)"
          # docker-publish fija esta label al SHA del tag resuelto por
          # resolve-tag (no github.sha: bajo workflow_dispatch difieren).
          REVISION="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "johpaz/hive-agents:$VERSION")"
          echo "revision de la imagen: $REVISION (esperada: $EXPECTED_SHA)"
          test "$REVISION" = "$EXPECTED_SHA"
      - name: La imagen publicada arranca y sirve su propia UI
        shell: bash
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          docker run -d --name hive-published -p 18790:18790 "johpaz/hive-agents:$VERSION"
          trap 'docker logs hive-published; docker rm -f hive-published' EXIT
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:18790/health 2>/dev/null | grep -q '"status":"ok"'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18790/health | grep -q "\"version\":\"$VERSION\""
          docker exec hive-published cat /app/ui/index.html > disk-index.html
          curl -fsSL http://127.0.0.1:18790/ > served-index.html
          DISK_ASSET="$(grep -o '/assets/index-[^"]*\.js' disk-index.html | head -1)"
          SERVED_ASSET="$(grep -o '/assets/index-[^"]*\.js' served-index.html | head -1)"
          test -n "$DISK_ASSET"
          test "$SERVED_ASSET" = "$DISK_ASSET"
          curl -fsS "http://127.0.0.1:18790$SERVED_ASSET" > /dev/null
