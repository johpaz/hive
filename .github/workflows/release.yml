name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ─── Build UI (shared artifact) ───────────────────────────────────────────
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install UI dependencies
        run: |
          # Stub other workspace packages for monorepo resolution
          VERSION=$(node -p "require('./package.json').version")
          for pkg in core cli mcp skills code-bridge sdk; do
            mkdir -p packages/$pkg
            echo "{\"name\":\"@johpaz/hive-agents-${pkg}\",\"version\":\"${VERSION}\"}" > packages/$pkg/package.json
          done
          bun install

      - name: Build UI
        run: cd packages/hive-ui && bun run build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/
          retention-days: 1

  # ─── Build binaries ────────────────────────────────────────────────────────
  build-binaries:
    name: Build binary (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            runner: ubuntu-latest
            target: bun-linux-x64
          - name: linux-arm64
            runner: ubuntu-latest
            target: bun-linux-arm64
          - name: macos-x64
            runner: ubuntu-latest
            target: bun-darwin-x64
          - name: macos-arm64
            runner: ubuntu-latest
            target: bun-darwin-arm64
          - name: windows-x64
            runner: ubuntu-latest
            target: bun-windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: hive-ui-dist
          path: packages/hive-ui/dist/

      - name: Install dependencies
        run: bun install

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate UI bundle
        run: bun scripts/generate-ui-bundle.ts

      - name: Compile binary
        run: |
          EXT=""
          [[ "${{ matrix.platform.name }}" == "windows-x64" ]] && EXT=".exe"
          bun build --compile \
            --target=${{ matrix.platform.target }} \
            --outfile=hive-v${{ steps.version.outputs.VERSION }}-${{ matrix.platform.name }}${EXT} \
            ./packages/cli/src/index.ts

      - name: Make executable (Unix)
        if: matrix.platform.name != 'windows-x64'
        run: chmod +x hive-v${{ steps.version.outputs.VERSION }}-${{ matrix.platform.name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.name }}
          path: hive-v${{ steps.version.outputs.VERSION }}-${{ matrix.platform.name }}*
          retention-days: 1

  # ─── GitHub Release ────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ui, build-binaries]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package UI dist
        run: |
          cd artifacts/hive-ui-dist
          tar -czf ../../ui-dist.tar.gz .
          cd ../..

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "hive-v*" -type f | while read f; do
            cp "$f" "../$(basename $f)"
          done
          cd ..
          sha256sum hive-v* ui-dist.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Hive v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Instalación rápida

            **Docker (recomendado):**
            ```bash
            docker run -d -p 18790:18790 -v ~/.hive:/root/.hive --name hive johpaz/hive-agents:${{ steps.version.outputs.VERSION }}
            ```

            **npm:**
            ```bash
            npm install -g @johpaz/hive-agents@${{ steps.version.outputs.VERSION }}
            ```

            **Binario (Linux x64):**
            ```bash
            curl -L -o hive https://github.com/johpaz/hive/releases/download/${{ github.ref_name }}/hive-v${{ steps.version.outputs.VERSION }}-linux-x64
            chmod +x hive && ./hive start
            ```

            Ver el [README](https://github.com/johpaz/hive#instalaci%C3%B3n) para todas las opciones de instalación.
          files: |
            hive-v*
            ui-dist.tar.gz
            checksums.txt
          generate_release_notes: true

  # ─── Docker Hub ────────────────────────────────────────────────────────────
  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            johpaz/hive-agents:latest
            johpaz/hive-agents:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── npm ──────────────────────────────────────────────────────────────────
  npm:
    name: npm publish
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
