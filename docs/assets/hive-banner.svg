<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Hive — runtime de agentes IA local-first">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd873"/>
      <stop offset="1" stop-color="#f2a93b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf0e0"/>
      <stop offset="1" stop-color="#22a6a1"/>
    </linearGradient>
    <polygon id="hex10" points="9,-5 9,5 0,10 -9,5 -9,-5 0,-10"/>
    <polygon id="hex18" points="16,-9 16,9 0,18 -16,9 -16,-9 0,-18"/>
    <polygon id="hex30" points="26,-15 26,15 0,30 -26,15 -26,-15 0,-30"/>
    <polygon id="hex45" points="39,-23 39,23 0,45 -39,23 -39,-23 0,-45"/>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bgGrad)"/>

  <!-- textura hexagonal de fondo -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05">
    <use href="#hex10" x="620" y="40"/>
    <use href="#hex10" x="1120" y="50"/>
    <use href="#hex10" x="640" y="230"/>
    <use href="#hex10" x="1140" y="220"/>
    <use href="#hex10" x="1000" y="20"/>
    <use href="#hex10" x="700" y="245"/>
    <use href="#hex10" x="1080" y="30"/>
    <use href="#hex10" x="600" y="150"/>
    <use href="#hex10" x="1150" y="130"/>
  </g>

  <!-- panal decorativo -->
  <g>
    <use href="#hex45" x="860" y="130" fill="url(#goldGrad)" fill-opacity="0.07" stroke="url(#goldGrad)" stroke-opacity="0.25"/>
    <use href="#hex30" x="955" y="60" fill="url(#tealGrad)" fill-opacity="0.12" stroke="url(#tealGrad)" stroke-opacity="0.35"/>
    <use href="#hex30" x="770" y="195" fill="url(#tealGrad)" fill-opacity="0.1" stroke="url(#tealGrad)" stroke-opacity="0.3"/>
    <use href="#hex18" x="1050" y="90" fill="none" stroke="url(#tealGrad)" stroke-opacity="0.3"/>
    <use href="#hex18" x="700" y="75" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.25"/>
    <use href="#hex18" x="1075" y="195" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.2"/>
  </g>

  <!-- coordinador delegando a agentes de catálogo -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="860" y1="130" x2="955" y2="130"/>
    <line x1="860" y1="130" x2="908" y2="48"/>
    <line x1="860" y1="130" x2="813" y2="48"/>
    <line x1="860" y1="130" x2="765" y2="130"/>
    <line x1="860" y1="130" x2="813" y2="212"/>
    <line x1="860" y1="130" x2="908" y2="212"/>
  </g>
  <g stroke="#0a0f1e" stroke-width="1.5">
    <circle cx="955" cy="130" r="7" fill="url(#tealGrad)"/>
    <circle cx="908" cy="48" r="7" fill="url(#tealGrad)"/>
    <circle cx="813" cy="48" r="7" fill="url(#tealGrad)"/>
    <circle cx="765" cy="130" r="7" fill="url(#tealGrad)"/>
    <circle cx="813" cy="212" r="7" fill="url(#tealGrad)"/>
    <circle cx="908" cy="212" r="7" fill="url(#tealGrad)"/>
    <circle cx="860" cy="130" r="10" fill="url(#goldGrad)"/>
  </g>

  <!-- wordmark -->
  <text x="70" y="148" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#goldGrad)" letter-spacing="1">HIVE</text>
  <line x1="72" y1="172" x2="392" y2="172" stroke="url(#tealGrad)" stroke-opacity="0.7" stroke-width="3"/>
  <text x="72" y="204" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#a9b4c9">Runtime de agentes IA · local-first · multi-canal</text>
</svg>
